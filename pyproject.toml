[project]
name = "catalog-analysis"
version = "0.1.0"
description = "Анализ каталога фильмов"
requires-python = ">=3.12"

dependencies = [
    "pytest>=8.0.0",
    "mypy>=2.0.0",
    "ruff>=0.4.0"
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
